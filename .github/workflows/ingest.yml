name: news feed ingest

# Why GitHub Actions and not Netlify scheduled functions:
#
# Netlify's 2026 free plan is credit-metered (300 credits/month shared across
# bandwidth, builds and function compute) and when the credits run out the free
# plan STOPS SERVING TRAFFIC. A job running every few minutes burning function
# compute against that shared pool is a live risk to pesomnia.com itself.
# Not worth it for a news widget.
#
# GitHub Actions on a PUBLIC repo has unlimited minutes. The repo holds only
# public feed URLs and scoring config; every credential lives in Actions
# Secrets and is never committed.
#
# Note the cadence floor: GitHub's scheduled workflows run at a 5 minute
# minimum and can be delayed at peak times. That is fine here. The feeds that
# genuinely need sub-5-minute latency are the REMIT ones, and they publish on
# their own schedule anyway.

on:
  schedule:
    # The scheduler is only the RESTARTER now. Measured 25 Sep - 8 Oct 2026:
    # GitHub fired this repo's */5 schedule once every ~3.5 h (median; worst
    # 12.2 h), so the 5-minute cadence lives inside the job instead - each
    # run is a daemon looping the ingest every 5 minutes for ~5.5 hours
    # (tools/ingest_loop.sh), and a schedule tick that lands mid-daemon just
    # QUEUES the next daemon behind it (the concurrency group below).
    - cron: "*/30 * * * *"
  workflow_dispatch:        # lets Alex trigger a run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: news-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest daemon (5-minute ticks for ~5.5 hours)
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          AGSI_KEY: ${{ secrets.AGSI_KEY }}
        # touch .env inside the loop: on a machine with no .env the script
        # creates a template and exits 0 - an empty file satisfies the
        # check; real env vars (the secrets above) win. Commit policy and
        # push retries live in the loop script.
        run: bash tools/ingest_loop.sh

  # Runs once a day and fails loudly if sources have gone dark. Feeds rot
  # silently otherwise: a dead URL just means fewer items, which looks like
  # a quiet news day rather than a broken pipeline.
  healthcheck:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
          AGSI_KEY: ${{ secrets.AGSI_KEY }}
        run: |
          touch .env
          python src/ingest.py --check
